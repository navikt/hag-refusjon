spec:
  accessPolicy:
    outbound:
      external:
        - host: pdl-api.dev-fss-pub.nais.io
        - host: data.ppe.brreg.no
  kafka:
    pool: nav-dev
  gcp:
    buckets:
      - name: helsearbeidsgiver-refusjon-dev
        #retentionPeriodDays: 1
  env:
    - name: BRREG_URL
      value: "https://data.ppe.brreg.no/enhetsregisteret/api/underenheter"
    - name: GCP_BUCKET_NAME
      value: helsearbeidsgiver-refusjon-dev
    - name: PDL_URL
      value: "https://pdl-api.dev-fss-pub.nais.io/graphql"
    - name: PDL_SCOPE
      value: "api://dev-fss.pdl.pdl-api/.default"

  ingresses:
    - https://hag-refusjon.intern.dev.nav.no
